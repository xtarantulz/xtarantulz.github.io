<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#000000">
    <meta name="description" content="Класична гра Танчики у стилі Battle City для Dendy.">

    <title>Танчики | Canvas</title>

    <link rel="stylesheet" href="../../assets/css/layout.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div id="siteHeader"></div>
<main class="game">
    <div class="game__container">
        <div class="game__screen">
            <canvas id="game" width="416" height="416"></canvas>
        </div>

        <!-- Мобільний геймпад -->
        <div class="mobile-gamepad" id="mobile-gamepad" data-preview-hide aria-label="Мобільне керування">
            <div class="dpad" id="touch-dpad">
                <button class="dpad__btn dpad__btn--up" data-dir="up" type="button" aria-label="Вгору">▲</button>
                <button class="dpad__btn dpad__btn--left" data-dir="left" type="button" aria-label="Вліво">◀</button>
                <div class="dpad__center"></div>
                <button class="dpad__btn dpad__btn--right" data-dir="right" type="button" aria-label="Вправо">▶</button>
                <button class="dpad__btn dpad__btn--down" data-dir="down" type="button" aria-label="Вниз">▼</button>
            </div>

            <div class="gamepad-center">
                <button class="gamepad-pill is-start" id="touch-pause" type="button">START</button>
            </div>

            <div class="gamepad-actions">
                <button class="fire-btn" id="touch-fire" type="button" aria-label="Постріл">
                    <span>FIRE</span>
                </button>
            </div>
        </div>

        <aside class="game__sidebar" data-preview-hide>
            <div class="game__logo">
                <span>BATTLE</span>
                <span>CITY</span>
                <span class="game__by">by</span>
                <span class="game__author">xTaRaNTuLz</span>
            </div>

            <div class="game__info">
                <div class="game__info-item">
                    <span>Рівень</span>
                    <strong id="level">01</strong>
                </div>

                <div class="game__info-item">
                    <span>Гравець</span>
                    <strong id="lives">03</strong>
                </div>

                <div class="game__info-item">
                    <span>Вороги</span>
                    <strong id="enemies">20</strong>
                </div>

                <div class="game__info-item">
                    <span>Рахунок</span>
                    <strong id="score">00000</strong>
                </div>
            </div>

            <div class="game__controls">
                <h2>Керування</h2>
                <div class="game__controls-move">
                    <div class="game__keys-stack">
                        <span class="game__keys-row">
                            <kbd>W</kbd> <kbd>A</kbd> <kbd>S</kbd> <kbd>D</kbd>
                        </span>
                        <span class="game__keys-row">
                            <kbd>↑</kbd> <kbd>←</kbd> <kbd>↓</kbd> <kbd>→</kbd>
                        </span>
                    </div>
                    <span class="game__controls-label">Рух</span>
                </div>
                <p><kbd>Space</kbd> Постріл</p>
                <p><kbd>Enter</kbd> Старт / Пауза</p>
            </div>

            <button class="game__start" id="start-button" type="button">
                Почати гру
            </button>
        </aside>
    </div>
</main>

<div id="siteFooter"></div>

<script src="../../assets/js/layout.js"></script>
<script type="module" src="script.js"></script>

</body>
</html>
