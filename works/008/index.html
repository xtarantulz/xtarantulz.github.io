<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#000000">
  <meta name="description" content="Інтерактивна анімація неонових стільників на Canvas.">
  <title>Неонові стільники | Canvas</title>

  <link rel="stylesheet" href="../../assets/css/layout.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>

<div id="siteHeader"></div>

<main class="honeycomb-page" data-preview-content>

  <canvas id="honeycombCanvas"></canvas>

  <section class="honeycomb-content" data-preview-hide>
    <span class="section-label">CANVAS EXPERIMENT #008</span>

    <h1>Неонові <span>стільники.</span></h1>

    <p>
      Жива геометрія світла. Торкайся поверхні,
      щоб запускати хвилі енергії між комірками.
    </p>
  </section>

  <div class="honeycomb-controls" data-preview-hide>
    <button id="toggleAnimation" type="button">
      Призупинити
    </button>

    <button id="resetAnimation" type="button">
      Скинути ефекти
    </button>
  </div>

</main>

<div id="siteFooter"></div>

<script src="../../assets/js/layout.js"></script>
<script src="script.js"></script>

</html>
